<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentLink — Room Aktif</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 32px; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 span { color: #f97316; }
    .subtitle { color: #a1a1aa; font-size: 14px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1a1b26;
      border: 1px solid #2a2b3a;
      border-radius: 12px;
      padding: 16px 20px;
      flex: 1;
    }
    .stat-card .label { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .stat-card .value.active { color: #22c55e; }
    .stat-card .value.total { color: #3b82f6; }
    .stat-card .value.agents { color: #a855f7; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar h2 { font-size: 18px; }
    .refresh-btn {
      background: #1a1b26;
      border: 1px solid #2a2b3a;
      color: #e4e4e7;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: #f97316; color: #f97316; }
    .refresh-btn:focus-visible {
      outline: 2px solid #f97316;
      outline-offset: 2px;
    }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .room-list { display: flex; flex-direction: column; gap: 12px; }
    .room-card {
      background: #1a1b26;
      border: 1px solid #2a2b3a;
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .room-card:hover { border-color: #3a3b4a; }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .room-name { font-size: 18px; font-weight: 600; }
    .room-id {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      color: #a1a1aa;
      background: #0f1117;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .room-meta {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #a1a1aa;
      flex-wrap: wrap;
    }
    .room-meta .agent-count {
      color: #a855f7;
      font-weight: 600;
    }
    .room-side { text-align: right; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.active { background: #22c55e20; color: #22c55e; }
    .badge.recent { background: #3b82f620; color: #3b82f6; }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: #a1a1aa;
    }
    .loading {
      text-align: center;
      padding: 48px;
      color: #a1a1aa;
    }
    .error-state {
      text-align: center;
      padding: 48px;
      color: #ef4444;
    }
    .last-updated { font-size: 12px; color: #a1a1aa; margin-top: 16px; text-align: right; }
    @media (max-width: 480px) {
      .stats { flex-direction: column; }
      .room-header { flex-direction: column; align-items: flex-start; }
      .room-side { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Agent<span>Link</span></h1>
      <p class="subtitle">Room aktif dalam 3 hari terakhir</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Room Aktif (3 hari)</div>
        <div class="value active" id="stat-active">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Room</div>
        <div class="value total" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Agent</div>
        <div class="value agents" id="stat-agents">—</div>
      </div>
    </div>

    <div class="toolbar">
      <h2>Daftar Room</h2>
      <button class="refresh-btn" id="refresh-btn" type="button">↻ Refresh</button>
    </div>

    <div class="room-list" id="room-list">
      <div class="loading">Memuat data room...</div>
    </div>

    <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="last-updated" id="last-updated"></div>
  </div>

  <script>
    const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;

    function timeAgo(isoDate) {
      const diff = Date.now() - new Date(isoDate).getTime();
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const days = Math.floor(hours / 24);
      if (days > 0) return `${days} hari yang lalu`;
      if (hours > 0) return `${hours} jam yang lalu`;
      const minutes = Math.floor(diff / (1000 * 60));
      return `${minutes} menit yang lalu`;
    }

    function formatDate(isoDate) {
      return new Date(isoDate).toLocaleString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadRooms() {
      const btn = document.getElementById('refresh-btn');
      const list = document.getElementById('room-list');
      const status = document.getElementById('sr-status');
      btn.disabled = true;
      list.innerHTML = '<div class="loading">Memuat data room...</div>';

      try {
        const res = await fetch('/rooms');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rooms = await res.json();

        if (!Array.isArray(rooms)) {
          list.innerHTML = '<div class="error-state">Format data tidak valid</div>';
          status.textContent = 'Gagal memuat data room: format tidak valid.';
          return;
        }

        const now = Date.now();
        const activeRooms = rooms
          .filter(r => {
            const created = new Date(r.created_at).getTime();
            return (now - created) <= THREE_DAYS_MS;
          })
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        const totalAgents = activeRooms.reduce((sum, r) => sum + (r.agent_count || 0), 0);

        document.getElementById('stat-active').textContent = activeRooms.length;
        document.getElementById('stat-total').textContent = rooms.length;
        document.getElementById('stat-agents').textContent = totalAgents;

        if (activeRooms.length === 0) {
          list.innerHTML = '<div class="empty-state">Tidak ada room aktif dalam 3 hari terakhir.</div>';
        } else {
          list.innerHTML = activeRooms.map(r => {
            const ageHours = (now - new Date(r.created_at).getTime()) / (1000 * 60 * 60);
            const badge = ageHours < 24
              ? '<span class="badge active">Aktif</span>'
              : '<span class="badge recent">Terbaru</span>';
            return `
              <div class="room-card">
                <div class="room-header">
                  <div>
                    <div class="room-name">${escapeHtml(r.name || 'Unnamed')}</div>
                    <div class="room-meta">
                      <span class="room-id">${escapeHtml(r.room_id || '')}</span>
                      <span>📅 ${formatDate(r.created_at)}</span>
                      <span>⏱ ${timeAgo(r.created_at)}</span>
                    </div>
                  </div>
                  <div class="room-side">
                    ${badge}
                    <div class="room-meta" style="margin-top: 8px;">
                      <span class="agent-count">👥 ${r.agent_count || 0} agent</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }

        document.getElementById('last-updated').textContent =
          'Terakhir diperbarui: ' + new Date().toLocaleTimeString('id-ID');
        status.textContent =
          `Data diperbarui: ${activeRooms.length} room aktif dari total ${rooms.length} room.`;
      } catch (err) {
        list.innerHTML = `<div class="error-state">Gagal memuat data: ${escapeHtml(err.message)}</div>`;
        status.textContent = `Gagal memuat data room: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadRooms);
    loadRooms();
    setInterval(loadRooms, 60000);
  </script>
</body>
</html>
