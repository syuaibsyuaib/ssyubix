name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# Batalkan run lama saat ada push baru ke ref yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./python

      - name: Run unit tests
        run: python -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Build Python package
        run: python -m build ./python

  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Glob, bukan daftar manual: file test baru di src/ ikut terjaring sendiri.
      - name: Run Worker unit tests
        run: npx tsx --test src/*.test.ts

      # tsx dan wrangler diambil dari node_modules hasil `npm ci`, supaya versi
      # yang diuji CI sama dengan yang dipakai proyek.
      - name: Validate Worker bundle
        run: npx wrangler deploy --config src/wrangler.jsonc --dry-run
